paths:
  /api/depts:
    get:
      summary: Получение списка отделений клиники
      description: Возвращает список всех отделений / категорий услуг медицинской клиники
      tags:
        - Отделения
      produces:
        - application/json
      responses:
        "200":
          description: Список отделений
          schema:
            $ref: '#/definitions/response.DeptListResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'

  /api/pictures:
    get:
      summary: Получение списка изображений
      description: |
        Возвращает список изображений из указанной директории с поддержкой пагинации,
        сортировки, поиска и генерации миниатюр.
      tags:
        - Изображения
      produces:
        - application/json
      parameters:
        - in: query
          name: all
          description: Вернуть все изображения без пагинации (0 - с пагинацией, 1 - все)
          type: integer
          enum: [0, 1]
          default: 0
        - in: query
          name: thumbs
          description: Генерировать миниатюры (0 - нет, 1 - да)
          type: integer
          enum: [0, 1]
          default: 0
        - in: query
          name: cache
          description: Время кеширования результата в секундах
          type: integer
          default: 3600
        - in: query
          name: dir
          description: Директория с изображениями (по умолчанию берётся из настроек системы)
          type: string
        - in: query
          name: exts
          description: Разрешённые расширения файлов (через запятую)
          type: string
          default: "jpg,jpeg,png"
        - in: query
          name: sortby
          description: Поле для сортировки
          type: string
          enum: ["name", "date", "size", "random"]
          default: "date"
        - in: query
          name: page
          description: Номер страницы. Нечисловые значения приводятся к дефолтному значению
          type: integer
          default: 1
        - in: query
          name: perPage
          description: Количество элементов на странице. Нечисловые значения приводятся к дефолтному значению
          type: integer
          default: 10
        - in: query
          name: search
          description: Поиск по имени файла
          type: string
        - in: query
          name: sortdir
          description: Направление сортировки
          type: string
          enum: ["ASC", "DESC"]
          default: "DESC"
      responses:
        "200":
          description: Список изображений
          schema:
            $ref: '#/definitions/response.PictureListResponse'
        "400":
          description: Неверные параметры
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/response.ErrorResponse'

  /api/team:
    get:
      summary: Получение списка сотрудников клиники
      description: Возвращает список всех сотрудников клиники с фильтрацией по отделению
      tags:
        - Сотрудники
      produces:
        - application/json
      parameters:
        - in: query
          name: dept_id
          description: Фильтр по ID отдела (отделения). Нечисловые значения игнорируются
          type: integer
      responses:
        "200":
          description: Список сотрудников
          schema:
            $ref: '#/definitions/response.TeamListResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/response.ErrorResponse'

  /api/pricelist:
    get:
      summary: Получение списка позиций прайс-листа
      description: |
        Возвращает список позиций прайс-листа с поддержкой пагинации,
        сортировки, поиска и фильтрации по отделению, специалисту и статусу скрытия.
      tags:
        - Прайс-лист
      produces:
        - application/json
      parameters:
        - in: query
          name: page
          description: Номер страницы. Нечисловые значения приводятся к дефолтному значению
          type: integer
          default: 1
        - in: query
          name: perPage
          description: Количество элементов на странице. Нечисловые значения приводятся к дефолтному значению
          type: integer
          default: 10
        - in: query
          name: sortby
          description: Поле для сортировки
          type: string
          enum: ["id", "name", "price", "updatedAt", "createdAt"]
          default: "updatedAt"
        - in: query
          name: sortdir
          description: Направление сортировки
          type: string
          enum: ["ASC", "DESC"]
          default: "DESC"
        - in: query
          name: search
          description: Поиск по name и desc
          type: string
        - in: query
          name: spec_id
          description: Фильтр по ID специалиста. Нечисловые значения игнорируются
          type: integer
        - in: query
          name: dept_id
          description: Фильтр по ID отделения. Нечисловые значения игнорируются
          type: integer
        - in: query
          name: is_hidden
          description: Фильтр по статусу скрытия. Принимает только 0 или 1
          type: integer
          enum: [0, 1]
      responses:
        "200":
          description: Список позиций
          schema:
            $ref: '#/definitions/response.PricelistListResponse'
        "400":
          description: Неверные параметры
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/response.ErrorResponse'

    post:
      summary: Создание новой позиции прайс-листа
      description: Добавляет новую услугу в прайс-лист клиники (требуется роль Administrator)
      tags:
        - Прайс-лист
      consumes:
        - application/json
      produces:
        - application/json
      security:
        - BearerAuth: []
      parameters:
        - in: body
          name: request
          description: Данные для создания позиции
          required: true
          schema:
            $ref: '#/definitions/request.PricelistCreateRequest'
      responses:
        "200":
          description: Позиция создана
          schema:
            $ref: '#/definitions/response.PricelistSingleResponse'
          examples:
            application/json:
              {
                "success": true,
                "data": {
                  "id": 47,
                  "name": "Профессиональная гигиена полости рта (Air Flow)",
                  "price": 3900,
                  "isMinValue": 1,
                  "dept_id": 17,
                  "subdept_id": 0,
                  "is_hidden": 0,
                  "createdAt": "2026-09-15T12:28:00Z",
                  "updatedAt": "2026-09-15T12:28:00Z",
                  "success": true
                },
                "meta": { "total_time": "0.2633 s", "query_time": "0.0036 s", "php_time": "0.2597 s", "queries": 7, "source": "cache", "memory": "10 240 KB" }
              }
        "400":
          description: Ошибка валидации
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Не авторизован (требуется роль Administrator)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
          examples:
            application/json:
              {
                "success": true,
                "data": { "success": false, "message": "Unauthorized" },
                "meta": { "total_time": "0.0722 s", "query_time": "0.0010 s", "php_time": "0.0713 s", "queries": 3, "source": "cache", "memory": "10 240 KB" }
              }
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/response.ErrorResponse'

  /api/pricelist/{id}:
    patch:
      summary: Частичное обновление позиции прайс-листа
      description: |
        Обновляет существующую позицию прайс-листа (требуется роль Administrator).
        Обязательные поля: name, price. Остальные поля опциональны.
      tags:
        - Прайс-лист
      consumes:
        - application/json
      produces:
        - application/json
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          description: ID позиции прайс-листа
          required: true
          type: integer
        - in: body
          name: request
          description: Данные для обновления позиции
          required: true
          schema:
            $ref: '#/definitions/request.PricelistUpdateRequest'
      responses:
        "200":
          description: Позиция обновлена
          schema:
            $ref: '#/definitions/response.PricelistSingleResponse'
          examples:
            application/json:
              {
                "success": true,
                "data": {
                  "id": 47,
                  "name": "Лечение среднего кариеса с пломбировкой",
                  "price": 6050,
                  "isMinValue": 0,
                  "dept_id": 12,
                  "subdept_id": 0,
                  "is_hidden": 1,
                  "createdAt": "2026-09-15T15:28:00Z",
                  "updatedAt": "2026-09-15T12:29:00Z",
                  "success": true
                },
                "meta": { "total_time": "0.2802 s", "query_time": "0.0065 s", "php_time": "0.2737 s", "queries": 16, "source": "cache", "memory": "10 240 KB" }
              }
        "400":
          description: Ошибка валидации
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Не авторизован (требуется роль Administrator)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Позиция не найдена
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/response.ErrorResponse'

    delete:
      summary: Удаление позиции прайс-листа
      description: Удаляет позицию прайс-листа (требуется роль Administrator)
      tags:
        - Прайс-лист
      produces:
        - application/json
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          description: ID позиции прайс-листа
          required: true
          type: integer
      responses:
        "200":
          description: Позиция удалена
          schema:
            $ref: '#/definitions/response.PricelistDeleteResponse'
          examples:
            application/json:
              {
                "success": true,
                "data": { "id": 47, "success": true },
                "meta": { "total_time": "0.1508 s", "query_time": "0.0040 s", "php_time": "0.1468 s", "queries": 16, "source": "cache", "memory": "10 240 KB" }
              }
        "401":
          description: Не авторизован (требуется роль Administrator)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Позиция не найдена
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "405":
          description: Метод не разрешён
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/response.ErrorResponse'

  /api/examples:
    get:
      summary: Получение списка примеров работ
      description: |
        Возвращает список примеров работ (кейсов) клиники с поддержкой пагинации,
        сортировки, поиска и фильтрации по специалисту, отделению и статусу скрытия.
      tags:
        - Примеры работ
      produces:
        - application/json
      parameters:
        - in: query
          name: page
          description: Номер страницы. Нечисловые значения приводятся к дефолтному значению
          type: integer
          default: 1
        - in: query
          name: perPage
          description: Количество элементов на странице. Нечисловые значения приводятся к дефолтному значению
          type: integer
          default: 10
        - in: query
          name: sortby
          description: Поле для сортировки
          type: string
          enum: ["id", "name", "updatedAt", "createdAt"]
          default: "updatedAt"
        - in: query
          name: sortdir
          description: Направление сортировки
          type: string
          enum: ["ASC", "DESC"]
          default: "DESC"
        - in: query
          name: search
          description: Поиск по name и desc
          type: string
        - in: query
          name: spec_id
          description: Фильтр по ID специалиста. Нечисловые значения игнорируются
          type: integer
        - in: query
