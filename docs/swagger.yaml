swagger: "2.0"
basePath: /
host: localhost:3000
info:
  title: Medical Clinic API
  description: |
    API для работы с медицинской клиникой (CMS MODX Revo).
    Все GET-запросы публичные.
    Все POST/PATCH/DELETE требуют роль Administrator MODX, исключения:
    - POST /api/testimonials (создание отзыва) — публичный
    - POST /api/feedback (обратная связь) — публичный.
    Формат всех ошибок единый.
  version: "1.0"
  contact: {}

schemes:
  - http
  - https

securityDefinitions:
  BearerAuth:
    type: apiKey
    in: header
    name: Authorization
    description: Внутренний механизм авторизации MODX (роль Administrator)

definitions:
  response.DeptItem:
    description: Информация об отделении / категории услуг клиники
    type: object
    properties:
      id:
        description: ID отделения
        type: integer
        example: 17
      pagetitle:
        description: Название отделения
        type: string
        example: "Профилактика"
      desc:
        description: Описание отделения
        type: string
        example: "Все мероприятия для профилактики: профилактические осмотры, профессиональная гигиена полости рта и отбеливание."
      menuindex:
        description: Порядок отображения в меню
        type: integer
        example: 5
      url:
        description: URL-адрес страницы отделения
        type: string
        example: "uslugi/profilaktika-zabolevanij-zubov/"

  response.PictureItem:
    description: Информация об изображении
    type: object
    properties:
      name:
        description: Имя файла
        type: string
        example: "Poshenkov_otbelivanie_zoom_posle_1_400x0_3c9.jpg"
      url:
        description: Относительный URL изображения
        type: string
        example: "/assets/images/examples/Poshenkov_otbelivanie_zoom_posle_1_400x0_3c9.jpg"
      size:
        description: Размер файла в байтах
        type: integer
        example: 31117
      size_formatted:
        description: Размер файла в человекочитаемом формате
        type: string
        example: "30.39 KB"
      date:
        description: Дата создания/изменения файла в формате Unix timestamp
        type: integer
        example: 1781582767
      updatedAt:
        description: Дата обновления в формате ISO 8601
        type: string
        format: date-time
        example: "2026-06-16T07:06:00Z"
      ext:
        description: Расширение файла
        type: string
        example: "jpg"
      width:
        description: Ширина изображения в пикселях
        type: integer
        example: 400
      height:
        description: Высота изображения в пикселях
        type: integer
        example: 240

  response.TeamPics:
    description: Изображения сотрудника (фото)
    type: object
    properties:
      webp:
        description: Путь к изображению в формате WebP
        type: string
        example: "/assets/components/phpthumbof/cache/pavlova-anna-andreevna.716b2ddfbee8671b7728c6d25f36b8ac.webp"
      thumb:
        description: Путь к миниатюре сотрудника
        type: string
        example: "/assets/components/phpthumbof/cache/pavlova-anna-andreevna.9f7569956ed53acb79be167ec4977333.jpg"

  response.TeamItem:
    description: Информация о сотруднике клиники
    type: object
    properties:
      id:
        description: ID сотрудника
        type: integer
        example: 53
      pagetitle:
        description: ФИО сотрудника
        type: string
        example: "Павлова Анна Андреевна"
      depts_id:
        description: Массив ID отделений, к которым относится сотрудник
        type: array
        items:
          type: integer
        example: [12, 16]
      depts:
        description: Список специализаций сотрудника (строка через запятую)
        type: string
        example: "терапевт, хирург-имплантолог"
      introtext:
        description: Ручное поле (редактируется через MODX)
        type: string
        example: "2022"
      menuindex:
        description: Порядок отображения в списке
        type: integer
        example: 10
      url:
        description: URL-адрес страницы сотрудника
        type: string
        example: "nasha-komanda/pavlova-anna-andreevna"
      pics:
        allOf:
          - $ref: '#/definitions/response.TeamPics'
        description: Изображения сотрудника

  response.PricelistItem:
    description: |
      Информация о позиции прайс-листа.
      Поле success внутри data — особенность бэкенда (наследие фреймворка).
    type: object
    properties:
      id:
        description: ID позиции
        type: integer
        example: 47
      name:
        description: Название услуги
        type: string
        example: "Профессиональная гигиена полости рта (Air Flow)"
      price:
        description: Цена услуги
        type: integer
        example: 3900
      isMinValue:
        description: |
          Флаг отображения цены:
          1 - цена указана как "от" (минимальная)
          0 - цена фиксированная или указано максимальное значение из диапазона
        type: integer
        enum: [0, 1]
        example: 1
      dept_id:
        description: ID отделения (категории)
        type: integer
        example: 17
      subdept_id:
        description: ID подкатегории (0 - если не указана)
        type: integer
        example: 0
      is_hidden:
        description: Флаг скрытия позиции на сайте. Принимает только 0 или 1
        type: integer
        enum: [0, 1]
        example: 0
      createdAt:
        description: Дата создания
        type: string
        format: date-time
        example: "2026-09-15T12:28:00Z"
      updatedAt:
        description: Дата обновления
        type: string
        format: date-time
        example: "2026-09-15T12:28:00Z"
      success:
        description: Статус успеха операции (присутствует в ответах create/update)
        type: boolean
        example: true

  response.ExampleImage:
    description: Изображение примера работы (до/после)
    type: object
    properties:
      webp:
        description: Путь к изображению в формате WebP (пустая строка, если не загружено)
        type: string
        example: "/assets/components/phpthumbof/cache/Sogomonyan%20do1_400x0_651.db724d516399eed3e97ae67d2d765f90.webp"
      thumb:
        description: Путь к миниатюре изображения (пустая строка, если не загружено)
        type: string
        example: "/assets/components/phpthumbof/cache/Sogomonyan%20do1_400x0_651.38436a190d8c46615fe5a9033ff3bf37.png"

  response.ExampleItem:
    description: |
      Информация о примере работы (кейсе) клиники.
      Поле success внутри data — особенность бэкенда (наследие фреймворка).
    type: object
    properties:
      id:
        description: ID примера
        type: integer
        example: 19
      name:
        description: Название примера (обычно "Пациент X лет")
        type: string
        example: "Пациент 31 год"
      desc:
        description: Описание примера (жалобы + что было сделано)
        type: string
        example: "Жалобы на эстетику улыбки. Изготовление и установка 10 виниров E-max."
      img_before:
        allOf:
          - $ref: '#/definitions/response.ExampleImage'
        description: Изображение "ДО"
      img_after:
        allOf:
          - $ref: '#/definitions/response.ExampleImage'
        description: Изображение "ПОСЛЕ"
      spec_id:
        description: ID специалиста; 0 — валидное значение «без привязки к врачу»
        type: integer
        example: 51
      dept_id:
        description: ID отделения (категории)
        type: integer
        example: 16
      subdept_id:
        description: ID подкатегории (0 - если не указана)
        type: integer
        example: 0
      is_hidden:
        description: Флаг скрытия примера на сайте. Принимает только 0 или 1
        type: integer
        enum: [0, 1]
        example: 0
      introtext:
        description: Computed-поле (только для чтения), формируется PHP-скриптом на основе связей
        type: string
        example: "Симонова Юлия Павловна"
      createdAt:
        description: Дата создания
        type: string
        format: date-time
        example: "2025-12-01T13:10:00Z"
      updatedAt:
        description: Дата обновления
        type: string
        format: date-time
        example: "2025-12-01T13:10:00Z"
      success:
        description: Статус успеха операции (присутствует в ответах create/update)
        type: boolean
        example: true

  response.TestimonialItem:
    description: |
      Информация об отзыве пациента.
      Поле success внутри data — особенность бэкенда (наследие фреймворка).
    type: object
    properties:
      id:
        description: ID отзыва
        type: integer
        example: 118
      name:
        description: Имя автора отзыва
        type: string
        example: "Елена Смирнова"
      desc:
        description: Текст отзыва
        type: string
        example: "Очень достойная стоматологическая клиника, доброжелательный и высококвалифицированный персонал, умеренный ценник оплаты услуг."
      spec_id:
        description: ID специалиста; 0 — валидное значение «без привязки к врачу»
        type: integer
        example: 44
      rating:
        description: Оценка (от 1 до 5)
        type: integer
        minimum: 1
        maximum: 5
        example: 5
      is_hidden:
        description: Флаг скрытия отзыва на сайте. Принимает только 0 или 1
        type: integer
        enum: [0, 1]
        example: 0
      introtext:
        description: Computed-поле (только для чтения), формируется PHP-скриптом на основе связей
        type: string
        example: "Новомодных Лариса Сергеевна"
      createdAt:
        description: Дата создания
        type: string
        format: date-time
        example: "2026-09-15T13:04:00Z"
      updatedAt:
        description: Дата обновления
        type: string
        format: date-time
        example: "2026-09-15T13:04:00Z"
      success:
        description: Статус успеха операции (присутствует в ответах create/update)
        type: boolean
        example: true

  response.FeedbackItem:
    description: |
      Информация о сохранённой форме обратной связи.
      Поле success внутри data — особенность бэкенда (наследие фреймворка).
    type: object
    properties:
      id:
        description: ID записи формы
        type: integer
        example: 15
      form:
        description: Идентификатор формы
        type: string
        example: "form-11"
      context_key:
        description: Ключ контекста MODX
        type: string
        example: "web"
      values:
        description: JSON-строка с переданными значениями формы
        type: string
        example: "{\"src\":\"Записаться, блок соц. сетей\",\"pageId\":\"11\",\"pagetitle\":\"Контакты\",\"phone\":\"+7 (989) 900 67 89\",\"name\":\"Олег\"}"
      ip:
        description: IP-адрес отправителя (учитывает Cloudflare и прокси)
        type: string
        example: "127.0.0.1"
      date:
        description: Дата отправки в формате Unix timestamp
        type: integer
        example: 1789467069
      encrypted:
        description: Признак шифрования
        type: boolean
        example: false
      encryption_type:
        description: Тип шифрования
        type: integer
        example: 1
      hash:
        description: Хеш формы
        type: string
        example: "d93db97f4214310414a6b74136eae9d9"
      success:
        description: Статус успеха операции
        type: boolean
        example: true

  request.PricelistCreateRequest:
    description: Запрос на создание позиции прайс-листа
    type: object
    required:
      - name
      - price
      - dept_id
    properties:
      name:
        description: Название услуги
        type: string
        example: "Профессиональная гигиена полости рта (Air Flow)"
      price:
        description: Цена услуги
        type: integer
        minimum: 0
        example: 3900
      isMinValue:
        description: Флаг "от" (1 - цена минимальная, 0 - фиксированная)
        type: integer
        enum: [0, 1]
        default: 1
        example: 1
      dept_id:
        description: ID отделения (категории)
        type: integer
        example: 17
      subdept_id:
        description: ID подкатегории (0 - если не указана)
        type: integer
        default: 0
        example: 0
      is_hidden:
        description: Флаг скрытия позиции на сайте. Принимает только 0 или 1
        type: integer
        enum: [0, 1]
        default: 0
        example: 0

  request.PricelistUpdateRequest:
    description: |
      Запрос на частичное обновление позиции прайс-листа (PATCH).
      Обязательные поля: name, price. Остальные поля опциональны.
    type: object
    required:
      - name
      - price
    properties:
      name:
        description: Название услуги (обязательно)
        type: string
        example: "Лечение среднего кариеса с пломбировкой"
      price:
        description: Цена услуги (обязательно)
        type: integer
        minimum: 0
        example: 6050
      isMinValue:
        description: Флаг "от" (1 - цена минимальная, 0 - фиксированная)
        type: integer
        enum: [0, 1]
        example: 0
      dept_id:
        description: ID отделения (категории)
        type: integer
        example: 12
      subdept_id:
        description: ID подкатегории (0 - если не указана)
        type: integer
        example: 0
      is_hidden:
        description: Флаг скрытия позиции на сайте. Принимает только 0 или 1
        type: integer
        enum: [0, 1]
        example: 1

  request.ExampleCreateRequest:
    description: |
      Запрос на создание примера работы (application/json).
      Изображения передаются как пути из галереи, полученной через /api/pictures.
    type: object
    required:
      - name
      - desc
      - spec_id
      - dept_id
    properties:
      name:
        description: Название примера (например, "Пациент 31 год")
        type: string
        example: "Пациент 31 год"
      desc:
        description: Описание примера (жалобы + что было сделано)
        type: string
        example: "Жалобы на эстетику улыбки. Изготовление и установка 10 виниров E-max."
      spec_id:
        description: ID специалиста; 0 — валидное значение «без привязки к врачу»
        type: integer
        example: 51
      dept_id:
        description: ID отделения (категории)
        type: integer
        example: 16
      subdept_id:
        description: ID подкатегории (0 - если не указана)
        type: integer
        default: 0
        example: 0
      is_hidden:
        description: Флаг скрытия примера на сайте. Принимает только 0 или 1
        type: integer
        enum: [0, 1]
        default: 0
        example: 0
      img_before:
        description: Путь к изображению "ДО" (из галереи /api/pictures)
        type: string
        example: "/assets/images/examples/Proshenkov_otbelivanie_2_do_400x0_3c9.jpg"
      img_after:
        description: Путь к изображению "ПОСЛЕ" (из галереи /api/pictures)
        type: string
        example: "/assets/images/examples/Poshenkov_otbelivanie_zoom_posle_1_400x0_3c9.jpg"

  request.ExampleUpdateRequest:
    description: |
      Запрос на частичное обновление примера работы (application/json).
      Обязательные поля: name, desc. Остальные поля опциональны.
      При отсутствии img_before/img_after старые изображения сохраняются.
    type: object
    required:
      - name
      - desc
    properties:
      name:
        description: Название примера (обязательно)
        type: string
        example: "Пациент 31 год"
      desc:
        description: Описание примера (обязательно)
        type: string
        example: "Жалобы на эстетику улыбки. Изготовление и установка 10 виниров E-max."
      spec_id:
        description: ID специалиста; 0 — валидное значение «без привязки к врачу»
        type: integer
        example: 51
      dept_id:
        description: ID отделения (категории)
        type: integer
        example: 16
      subdept_id:
        description: ID подкатегории (0 - если не указана)
        type: integer
        example: 0
      is_hidden:
        description: Флаг скрытия примера на сайте. Принимает только 0 или 1
        type: integer
        enum: [0, 1]
        example: 1
      img_before:
        description: Новый путь к изображению "ДО". Если не передан — старое изображение сохраняется.
        type: string
        example: "/assets/images/examples/Proshenkov_otbelivanie_2_do_400x0_3c9.jpg"
      img_after:
        description: Новый путь к изображению "ПОСЛЕ". Если не передан — старое изображение сохраняется.
        type: string
        example: "/assets/images/examples/Poshenkov_otbelivanie_zoom_posle_1_400x0_3c9.jpg"

  request.TestimonialCreateRequest:
    description: Запрос на создание отзыва (application/json)
    type: object
    required:
      - name
      - desc
      - rating
    properties:
      name:
        description: Имя автора отзыва
        type: string
        example: "Елена Смирнова"
      desc:
        description: Текст отзыва
        type: string
        example: "Очень достойная стоматологическая клиника, доброжелательный и высококвалифицированный персонал, умеренный ценник оплаты услуг."
      spec_id:
        description: ID специалиста; 0 — валидное значение «без привязки к врачу»
        type: integer
        default: 0
        example: 44
      rating:
        description: Оценка (от 1 до 5)
        type: integer
        minimum: 1
        maximum: 5
        example: 5
      is_hidden:
        description: Флаг скрытия отзыва на сайте. Принимает только 0 или 1
        type: integer
        enum: [0, 1]
        default: 0
        example: 0

  request.TestimonialUpdateRequest:
    description: |
      Запрос на частичное обновление отзыва (PATCH).
      Обязательные поля: name, desc. Остальные поля опциональны.
    type: object
    required:
      - name
      - desc
    properties:
      name:
        description: Имя автора отзыва (обязательно)
        type: string
        example: "Елена Смирнова"
      desc:
        description: Текст отзыва (обязательно)
        type: string
        example: "Прекрасная клиника! Врачи — настоящие профессионалы, лечение прошло безболезненно и комфортно."
      spec_id:
        description: ID специалиста; 0 — валидное значение «без привязки к врачу»
        type: integer
        example: 44
      rating:
        description: Оценка (от 1 до 5)
        type: integer
        minimum: 1
        maximum: 5
        example: 5
      is_hidden:
        description: Флаг скрытия отзыва на сайте. Принимает только 0 или 1
        type: integer
        enum: [0, 1]
        example: 1

  request.FeedbackCreateRequest:
    description: Данные формы обратной связи (произвольный набор полей)
    type: object
    properties:
      form:
        description: Идентификатор формы
        type: string
        example: "form-11"
      context_key:
        description: Ключ контекста MODX
        type: string
        example: "web"
      values:
        description: JSON-строка со значениями полей формы
        type: string
        example: "{\"src\":\"Записаться, блок соц. сетей\",\"pageId\":\"11\",\"pagetitle\":\"Контакты\",\"phone\":\"+7 (989) 900 67 89\",\"name\":\"Олег\"}"

  response.Meta:
    description: Метаданные выполнения запроса
    type: object
    properties:
      total_time:
        description: Общее время выполнения запроса
        type: string
        example: "0.1314 s"
      query_time:
        description: Время выполнения SQL-запросов
        type: string
        example: "0.0047 s"
      php_time:
        description: Время выполнения PHP-кода
        type: string
        example: "0.1267 s"
      queries:
        description: Количество выполненных SQL-запросов
        type: integer
        example: 13
      source:
        description: Источник данных (cache / database / filesystem)
        type: string
        example: "cache"
      memory:
        description: Использованная память
        type: string
        example: "10 240 KB"

  response.TestimonialPaginationData:
    description: Данные пагинации списка отзывов
    type: object
    properties:
      page:
        description: Текущая страница
        type: integer
        example: 1
      perPage:
        description: Количество элементов на странице
        type: integer
        example: 10
      totalCount:
        description: Общее количество отзывов
        type: integer
        example: 109
      totalPages:
        description: Общее количество страниц
        type: integer
        example: 11
      data:
        description: Массив отзывов
        type: array
        items:
          $ref: '#/definitions/response.TestimonialItem'
      sortby:
        description: Поле сортировки
        type: string
        example: "updatedAt"
      sortdir:
        description: Направление сортировки
        type: string
        enum: ["ASC", "DESC"]
        example: "DESC"
      search:
        description: Поисковый запрос
        type: string
        example: null

  response.TestimonialListData:
